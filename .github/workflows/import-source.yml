name: Import DSi source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import verified local Git bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="_import/devil-dsi-import.bundle"
          if [[ ! -f "$bundle" ]]; then
            echo "Source import already completed."
            exit 0
          fi
          git bundle verify "$bundle"
          cp .github/workflows/import-source.yml "$RUNNER_TEMP/import-source.yml"
          git fetch "$GITHUB_WORKSPACE/$bundle" main
          source_commit="$(git rev-parse FETCH_HEAD)"
          test "$source_commit" = "282e0b388d02262fb25ff22cd433834da78ccd6c"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --allow-unrelated-histories --no-commit -s ours "$source_commit"
          git read-tree --reset -u "$source_commit"
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/import-source.yml" .github/workflows/import-source.yml
          git add .github/workflows/import-source.yml
          git commit -m "Import complete experimental devil-dsi R3 source"
          git push origin HEAD:main
